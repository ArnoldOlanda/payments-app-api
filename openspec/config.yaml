# openspec/config.yaml — api (NestJS backend)
# Generated by sdd-init on 2026-07-21.

project:
  name: api
  type: backend-service
  domain: payments
  framework: nestjs
  framework_version: "^10.0.0"
  language: typescript
  node_version: "20.x"
  package_manager: yarn

testing:
  runner: jest
  jest_preset: ts-jest
  commands:
    unit: "yarn test"
    coverage: "yarn test:cov"
    e2e: "yarn test:e2e"
  test_environment: node
  test_paths:
    - "test/**/*.spec.ts"
    - "test/**/*.e2e-spec.ts"
  strict_tdd: true
  tdd_runner: "yarn test"
  evidence:
    record_coverage: true
    coverage_threshold: not-set

conventions:
  source_root: src
  test_root: test
  module_bundling: nest-cli
  formatting: prettier
  linting: eslint
  orm: typeorm
  database: postgres
  auth: passport-jwt
  docs: "@nestjs/swagger"
  mail: resend
  storage: cloudinary
  pdf: pdfmake

bounded_contexts:
  - account
  - analytics
  - auth
  - customer
  - files
  - health
  - mail
  - payment
  - printer
  - report
  - role
  - seed
  - user
  - zone

phase_rules:
  apply:
    allowed_edit_roots:
      - "src"
      - "test"
      - "openspec"
    must_run_before_commit:
      - "yarn lint"
      - "yarn test"
  verify:
    must_run:
      - "yarn test"
      - "yarn test:e2e"
    must_pass: true
  sync:
    must_update_artifacts: true

artifact_store: openspec
skill_registry: "../.atl/skill-registry.md"

strict_tdd: true
strict_tdd_runner: "yarn test"
execution_mode: interactive
chained_pr_strategy: auto-forecast
review_budget_lines: 400

# Notes for downstream SDD agents
notes:
  - "E2E suite uses ./test/jest-e2e.json — always run unit + e2e before declaring done."
  - "TypeORM migrations live under src/migrations; never edit generated migrations manually."
  - "Use Passport JWT strategy; do not introduce session-based auth."
  - "Swagger is exposed at /api/docs — keep @ApiTags and DTO decorators in sync with routes."